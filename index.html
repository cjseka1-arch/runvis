<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RUN-VIS LIVE | 런수학 원장실 실시간 AI 비서</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #141414;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    .live-active {
      background-color: #E50914 !important;
      border-color: #E50914 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 24px rgba(229, 9, 20, 0.55);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-black border-b border-[#333333] px-4 py-3.5 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <span class="text-lg sm:text-xl font-black tracking-wide text-[#E50914]">RUN-VIS</span>
        <span class="px-1.5 py-0.5 rounded bg-[#E50914]/20 border border-[#E50914]/50 text-[10px] font-black text-[#ff6b72]">LIVE</span>
        <span class="text-xs text-[#B3B3B3] hidden sm:inline">초고속 실시간 AI 비서</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          id="btnToggleSearch"
          class="px-2.5 py-1.5 rounded bg-[#181818] border border-[#333333] text-[11px] font-bold text-[#999999] hover:text-white cursor-pointer"
        >검색 OFF</button>
        <div id="statePill" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#181818] border border-[#333333] text-xs font-bold text-[#999999]">
          <span id="stateDot" class="w-2 h-2 rounded-full bg-[#666666]"></span>
          <span id="stateLabel">대기중</span>
        </div>
        <button
          type="button"
          id="btnOpenSettings"
          class="px-3 py-1.5 rounded bg-[#222222] border border-[#333333] text-xs font-bold text-[#B3B3B3] hover:text-white cursor-pointer"
        >설정</button>
      </div>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-5 py-4 space-y-4">

    <!-- 1. 실시간 Live 컨트롤 -->
    <section class="bg-[#222222] border border-[#333333] rounded-lg p-4 sm:p-5 space-y-3.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-[#B3B3B3]">Gemini Live 초고속 티키타카 모드</span>
          <span id="jsReadyBadge" class="text-[11px] px-2 py-0.5 rounded bg-[#141414] border border-[#4ade80]/50 text-[#4ade80] font-bold">
            준비됨
          </span>
        </div>
        <span id="micDiagBadge" class="text-xs text-[#999999]">통화 대기</span>
      </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <button
          type="button"
          id="liveToggleBtn"
          class="flex-1 py-4 px-4 rounded-lg border border-[#444444] bg-[#181818] hover:bg-[#2a2a2a] active:scale-[0.99] transition flex items-center justify-between gap-3 cursor-pointer"
        >
          <div class="flex items-center gap-3.5">
            <span id="micIconWrap" class="w-11 h-11 rounded-full bg-[#2a2a2a] flex items-center justify-center shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" />
              </svg>
            </span>
            <div class="text-left">
              <div id="liveBtnTitle" class="text-base font-bold text-white">실시간 음성 대화 시작</div>
              <div id="liveBtnSub" class="text-xs text-[#B3B3B3]">0.3초 초고속 반응 · 언제든 말을 끊고 대화할 수 있습니다.</div>
            </div>
          </div>
          <span id="liveSwitchBadge" class="px-3 py-1 rounded bg-[#2a2a2a] text-xs font-bold text-[#999999] shrink-0">OFF</span>
        </button>

        <button
          type="button"
          id="btnMuteMic"
          class="hidden sm:w-36 py-3.5 px-4 rounded-lg border border-[#3a3a3a] bg-[#181818] hover:bg-[#2a2a2a] transition flex sm:flex-col items-center justify-center gap-1 text-center cursor-pointer"
        >
          <span id="muteBtnTitle" class="text-xs font-bold text-white">마이크 끄기</span>
          <span id="muteBtnSub" class="text-[11px] text-[#999999]">일시 음소거</span>
        </button>
      </div>

      <!-- 실시간 상태 및 음량 바 -->
      <div class="bg-[#141414] border border-[#333333] rounded-md px-3.5 py-2.5 space-y-2">
        <div class="flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-[#E50914] font-bold shrink-0">상태:</span>
            <span id="liveStatusText" class="text-[#DDDDDD] truncate">[실시간 음성 대화 시작] 버튼을 눌러 런비스와 통화를 시작하세요.</span>
          </div>
        </div>
        <div id="volumeBarWrap" class="hidden w-full h-1.5 bg-[#222222] rounded-full overflow-hidden">
          <div id="volumeBar" class="h-full bg-[#E50914] transition-all duration-75" style="width: 0%;"></div>
        </div>
      </div>
    </section>

    <!-- 2. 하단 2단 영역: 대화창 & 승인 대기열 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

      <!-- 좌측: 대화 기록 -->
      <section class="lg:col-span-5 bg-[#222222] border border-[#333333] rounded-lg flex flex-col h-[460px]">
        <div class="px-4 py-3 border-b border-[#333333] flex items-center justify-between">
          <span class="text-xs font-bold text-white">실시간 대화 로그</span>
          <button type="button" id="btnClearChat" class="text-[11px] text-[#B3B3B3] hover:text-white cursor-pointer">비우기</button>
        </div>

        <div id="chatStream" class="flex-1 overflow-y-auto p-4 space-y-3">
          <div class="flex flex-col items-start space-y-1">
            <span class="text-[11px] font-bold text-[#E50914]">RUN-VIS LIVE</span>
            <div class="bg-[#181818] border border-[#333333] rounded-lg rounded-tl-none px-3.5 py-2.5 text-xs sm:text-sm text-[#EAEAEA] max-w-[92%] leading-relaxed">
              안녕하세요, 원장님! <strong>초고속 반응 튜닝</strong>과 <strong>젊은 여성 목소리(Leda)</strong>가 적용되었습니다. 바로 통화를 시작해 보세요!
            </div>
          </div>
        </div>

        <form id="chatForm" class="p-3 border-t border-[#333333] bg-[#1a1a1a] rounded-b-lg flex gap-2">
          <input
            id="textInput"
            type="text"
            placeholder="통화 중 글자로도 입력 가능"
            class="flex-1 bg-[#111111] border border-[#333333] focus:border-white rounded-md px-3 py-2 text-xs sm:text-sm text-white outline-none"
          />
          <button
            type="submit"
            class="px-4 py-2 rounded-md bg-[#E50914] hover:bg-[#c80812] text-xs sm:text-sm font-bold text-white cursor-pointer shrink-0"
          >전송</button>
        </form>
      </section>

      <!-- 우측: 승인 대기 & 완료 로그 -->
      <div class="lg:col-span-7 space-y-4">
        <section class="bg-[#222222] border border-[#333333] rounded-lg p-4 space-y-3">
          <div class="flex items-center justify-between border-b border-[#333333] pb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-white">원장님 승인 대기 작업</span>
              <span id="pendingCountBadge" class="text-[11px] font-bold px-2 py-0.5 rounded bg-[#141414] border border-[#333333] text-[#B3B3B3]">0건</span>
            </div>
            <button
              type="button"
              id="approveAllBtn"
              class="hidden px-3 py-1.5 rounded bg-[#E50914] hover:bg-[#c80812] text-xs font-bold text-white cursor-pointer"
            >전체 승인 및 문자 발송</button>
          </div>

          <div id="pendingArea" class="space-y-3">
            <div class="py-7 text-center text-xs text-[#777777]">
              대화 중 출결·보강·과제·학부모 리포트를 지시하시면 여기에 카드로 정리됩니다.
            </div>
          </div>
        </section>

        <section class="bg-[#222222] border border-[#333333] rounded-lg p-4 space-y-3">
          <div class="flex items-center justify-between border-b border-[#333333] pb-2.5">
            <span class="text-xs font-bold text-white">승인 완료 로그</span>
            <button type="button" id="btnClearLogs" class="text-[11px] text-[#B3B3B3] hover:text-white cursor-pointer">지우기</button>
          </div>
          <div id="logArea" class="space-y-2 max-h-44 overflow-y-auto">
            <div class="py-3 text-center text-xs text-[#666666]">완료된 내역이 없습니다.</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 설정 모달 -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-[#222222] border border-[#333333] rounded-lg max-w-md w-full p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-[#333333] pb-3">
        <h3 class="text-base font-bold text-white">런비스 Live 설정</h3>
        <button type="button" id="btnCloseSettingsX" class="text-[#B3B3B3] hover:text-white text-sm font-bold px-2 py-1 cursor-pointer">✕</button>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">Gemini API Key</label>
        <input
          id="modalApiKeyInput"
          type="text"
          placeholder="AIzaSy... (내 기기에만 저장됩니다)"
          class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none"
        />
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">AI 목소리 선택</label>
        <select id="modalVoiceSelect" class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none">
          <option value="Leda">Leda (젊고 생기 있는 여성 비서 · 추천)</option>
          <option value="Zephyr">Zephyr (밝고 상쾌한 젊은 여성)</option>
          <option value="Aoede">Aoede (친근하고 부드러운 여성)</option>
          <option value="Kore">Kore (차분하고 또렷한 여성)</option>
          <option value="Puck">Puck (활기찬 남성)</option>
          <option value="Charon">Charon (중후한 남성)</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">Live 모델명 (오류 시 변경)</label>
        <input
          id="modalModelInput"
          type="text"
          class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none"
        />
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" id="btnCloseSettings" class="flex-1 py-2.5 rounded-md border border-[#333333] bg-[#2a2a2a] text-xs font-bold text-white cursor-pointer">닫기</button>
        <button type="button" id="btnSaveSettings" class="flex-1 py-2.5 rounded-md bg-[#E50914] text-xs font-bold text-white cursor-pointer">저장</button>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-md bg-[#2a2a2a] border border-[#444444] text-xs font-bold text-white shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    var DEFAULT_LIVE_MODEL = 'gemini-2.5-flash-native-audio-preview-09-2025';
    var DEFAULT_VOICE = 'Leda';

    var ws = null;
    var isLiveConnected = false;
    var isMuted = false;
    var isSearchEnabled = false;

    // 오디오 입출력 변수
    var captureCtx = null;
    var playbackCtx = null;
    var mediaStream = null;
    var micSource = null;
    var processorNode = null;
    var nextPlayTime = 0;
    var activeSources = [];

    // 자막 버퍼
    var currentUserBubble = null;
    var currentAiBubble = null;

    var pendingTasks = [];
    var actionLogs = [];

    function getApiKey() {
      try { return (localStorage.getItem('runvis_api_key') || '').replace(/\s+/g, '').trim(); } catch (e) { return ''; }
    }
    function getVoiceName() {
      try { return localStorage.getItem('runvis_live_voice') || DEFAULT_VOICE; } catch (e) { return DEFAULT_VOICE; }
    }
    function getLiveModel() {
      try { return (localStorage.getItem('runvis_live_model') || DEFAULT_LIVE_MODEL).trim(); } catch (e) { return DEFAULT_LIVE_MODEL; }
    }

    function showToast(msg) {
      var box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('opacity-0');
      clearTimeout(box._t);
      box._t = setTimeout(function() { box.classList.add('opacity-0'); }, 2800);
    }

    function updateSearchBtnUI() {
      var btn = document.getElementById('btnToggleSearch');
      if (isSearchEnabled) {
        btn.textContent = '검색 ON';
        btn.className = 'px-2.5 py-1.5 rounded bg-[#13261a] border border-[#4ade80]/60 text-[11px] font-bold text-[#4ade80] cursor-pointer';
      } else {
        btn.textContent = '검색 OFF';
        btn.className = 'px-2.5 py-1.5 rounded bg-[#181818] border border-[#333333] text-[11px] font-bold text-[#999999] hover:text-white cursor-pointer';
      }
    }

    function toggleSearchMode() {
      isSearchEnabled = !isSearchEnabled;
      try { localStorage.setItem('runvis_search_on', isSearchEnabled ? '1' : '0'); } catch (e) {}
      updateSearchBtnUI();
      if (isLiveConnected) {
        showToast(isSearchEnabled ? '검색 ON (통화를 껐다 켜면 적용됩니다)' : '검색 OFF · 초고속 모드 (통화를 껐다 켜면 적용됩니다)');
      } else {
        showToast(isSearchEnabled ? '구글 실시간 검색 모드가 켜졌습니다.' : '초고속 대화 모드(검색 OFF)로 전환되었습니다.');
      }
    }

    function setLiveUI(state, statusText) {
      var dot = document.getElementById('stateDot');
      var label = document.getElementById('stateLabel');
      var pill = document.getElementById('statePill');
      var btn = document.getElementById('liveToggleBtn');
      var title = document.getElementById('liveBtnTitle');
      var sub = document.getElementById('liveBtnSub');
      var badge = document.getElementById('liveSwitchBadge');
      var iconWrap = document.getElementById('micIconWrap');
      var muteBtn = document.getElementById('btnMuteMic');
      var volWrap = document.getElementById('volumeBarWrap');
      var diag = document.getElementById('micDiagBadge');

      if (statusText) document.getElementById('liveStatusText').textContent = statusText;
      btn.classList.remove('live-active');

      if (state === 'OFF') {
        dot.className = 'w-2 h-2 rounded-full bg-[#666666]';
        label.textContent = '대기중';
        label.className = 'text-[#999999] font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#181818] border border-[#333333] text-xs font-bold';
        iconWrap.className = 'w-11 h-11 rounded-full bg-[#2a2a2a] text-white flex items-center justify-center shrink-0';
        title.textContent = '실시간 음성 대화 시작';
        sub.textContent = '0.3초 초고속 반응 · 언제든 말을 끊고 대화할 수 있습니다.';
        badge.textContent = 'OFF';
        badge.className = 'px-3 py-1 rounded bg-[#2a2a2a] text-[#999999] text-xs font-bold shrink-0';
        muteBtn.classList.add('hidden');
        volWrap.classList.add('hidden');
        diag.textContent = '통화 대기';
        diag.className = 'text-xs text-[#999999]';
      } else if (state === 'CONNECTING') {
        dot.className = 'w-2 h-2 rounded-full bg-yellow-400 animate-pulse';
        label.textContent = '연결중...';
        label.className = 'text-yellow-300 font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#262212] border border-yellow-500/50 text-xs font-bold';
        title.textContent = '런비스 Live 서버 연결 중...';
        badge.textContent = '...';
        diag.textContent = '연결 시도 중';
      } else if (state === 'LIVE') {
        dot.className = 'w-2 h-2 rounded-full bg-[#E50914] animate-ping';
        label.textContent = '실시간 통화중';
        label.className = 'text-white font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#2a1214] border border-[#E50914] text-xs font-bold';
        btn.classList.add('live-active');
        iconWrap.className = 'w-11 h-11 rounded-full bg-white text-[#E50914] flex items-center justify-center shrink-0';
        title.textContent = '통화 종료하기 (LIVE 연결됨)';
        sub.textContent = '편하게 말씀하세요! 대답 도중에 말을 끊어도 바로 듣습니다.';
        badge.textContent = 'LIVE';
        badge.className = 'px-3 py-1 rounded bg-white text-[#E50914] text-xs font-black shrink-0';
        muteBtn.classList.remove('hidden');
        volWrap.classList.remove('hidden');
        diag.textContent = isSearchEnabled ? '🟢 실시간 연결 (검색 ON)' : '⚡ 초고속 티키타카 연결됨';
        diag.className = 'text-xs font-bold text-[#4ade80]';
      }
    }

    // =========================================================
    // 실시간 Live 연결 시작 / 종료
    // =========================================================
    function toggleLiveSession() {
      if (isLiveConnected || ws) stopLiveSession();
      else startLiveSession();
    }

    async function startLiveSession() {
      var apiKey = getApiKey();
      if (!apiKey) {
        showToast('먼저 우측 상단 [설정]에서 Gemini API 키를 입력해 주세요!');
        openSettingsModal();
        return;
      }

      setLiveUI('CONNECTING', '마이크 권한과 제미나이 Live 서버를 연결하고 있습니다...');

      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        captureCtx = new AudioCtx();
        playbackCtx = new AudioCtx({ sampleRate: 24000 });
        if (captureCtx.state === 'suspended') await captureCtx.resume();
        if (playbackCtx.state === 'suspended') await playbackCtx.resume();
        nextPlayTime = 0;

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1
          }
        });

        var wsUrl = ['wss:', '', 'generativelanguage.googleapis.com', 'ws', 'google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(apiKey)].join('/');
        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
          sendSetupMessage();
        };

        ws.onmessage = async function(event) {
          try {
            var text = (event.data instanceof Blob) ? await event.data.text() : event.data;
            var msg = JSON.parse(text);
            handleServerMessage(msg);
          } catch (e) {
            console.error('WS 파싱 오류:', e);
          }
        };

        ws.onerror = function() {
          appendChat('system', 'WebSocket 연결 오류가 발생했습니다. API 키와 네트워크를 확인해 주세요.');
        };

        ws.onclose = function(e) {
          if (isLiveConnected) {
            appendChat('system', '통화가 종료되었습니다. (코드: ' + e.code + (e.reason ? ' / ' + e.reason : '') + ')');
          } else if (e.reason) {
            appendChat('system', '연결 실패: ' + e.reason);
          }
          cleanupLiveSession();
        };

      } catch (err) {
        appendChat('system', '시작 오류: ' + err.message);
        cleanupLiveSession();
      }
    }

    function sendSetupMessage() {
      var model = getLiveModel();
      if (model.indexOf('models/') !== 0) model = 'models/' + model;

      var toolsList = [
        {
          functionDeclarations: [
            {
              name: 'create_academy_task',
              description: '학생의 결석, 보강, 시간변경, 과제체크, 학부모 리포트 업무를 원장님 승인 대기 목록에 등록합니다.',
              parameters: {
                type: 'OBJECT',
                properties: {
                  student: { type: 'STRING', description: '학생 이름' },
                  category: { type: 'STRING', description: '결석, 보강, 시간변경, 과제체크, 학부모 리포트 중 하나' },
                  summary: { type: 'STRING', description: '업무 상세 요약 또는 학부모 문자 초안' },
                  isReport: { type: 'BOOLEAN', description: '학부모 리포트/문자 초안이면 true' }
                },
                required: ['student', 'category', 'summary']
              }
            },
            {
              name: 'approve_all_tasks',
              description: '현재 승인 대기 중인 모든 학원 업무를 일괄 승인 및 처리합니다.',
              parameters: { type: 'OBJECT', properties: {} }
            }
          ]
        }
      ];

      // 검색 ON일 때만 구글 검색 도구 활성화 (OFF일 때 반응 속도 극대화)
      if (isSearchEnabled) {
        toolsList.unshift({ googleSearch: {} });
      }

      var setupMsg = {
        setup: {
          model: model,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: getVoiceName()
                }
              }
            }
          },
          // ★ 초고속 반응 튜닝: 말 끝 감지 민감도 최상 + 대기 시간 0.3초 단축
          realtimeInputConfig: {
            automaticActivityDetection: {
              disabled: false,
              startOfSpeechSensitivity: 'START_SENSITIVITY_HIGH',
              endOfSpeechSensitivity: 'END_SENSITIVITY_HIGH',
              prefixPaddingMs: 100,
              silenceDurationMs: 300
            }
          },
          inputAudioTranscription: {},
          outputAudioTranscription: {},
          systemInstruction: {
            parts: [{
              text: '당신은 런수학학원 원장님의 전담 AI 비서 런비스입니다. ' +
                    '기계적인 존댓말을 절대 쓰지 말고, 친근하고 센스 있는 젊은 비서처럼 자연스러운 한국어 구어체로 1~2문장 이내로 아주 짧고 경쾌하게 티키타카 하듯 대답하세요. ' +
                    '원장님이 학생 결석, 보강, 시간변경, 과제체크, 학부모 리포트 등을 지시하면 반드시 create_academy_task 함수를 호출하고, ' +
                    '승인하거나 문자 보내라고 하면 approve_all_tasks 함수를 호출하세요.'
            }]
          },
          tools: toolsList
        }
      };

      ws.send(JSON.stringify(setupMsg));
    }

    function startMicStreaming() {
      micSource = captureCtx.createMediaStreamSource(mediaStream);
      // ★ 버퍼 크기 절반 축소 (4096 -> 2048)로 전송 지연 최소화
      processorNode = captureCtx.createScriptProcessor(2048, 1, 1);

      processorNode.onaudioprocess = function(e) {
        if (!isLiveConnected || !ws || ws.readyState !== WebSocket.OPEN || isMuted) return;

        var inputData = e.inputBuffer.getChannelData(0);

        var sum = 0;
        for (var i = 0; i < inputData.length; i++) sum += Math.abs(inputData[i]);
        var vol = Math.min(100, Math.round((sum / inputData.length) * 450));
        var volBar = document.getElementById('volumeBar');
        if (volBar) volBar.style.width = vol + '%';

        var pcm16 = downsampleTo16k(inputData, captureCtx.sampleRate);
        var b64 = arrayBufferToBase64(pcm16.buffer);

        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: 'audio/pcm;rate=16000',
              data: b64
            }]
          }
        }));
      };

      micSource.connect(processorNode);
      processorNode.connect(captureCtx.destination);
    }

    function handleServerMessage(msg) {
      if (msg.setupComplete) {
        isLiveConnected = true;
        isMuted = false;
        setLiveUI('LIVE', '⚡ 초고속 연결 완료! 지금 바로 편하게 말씀하세요.');
        startMicStreaming();
        return;
      }

      if (msg.toolCall && msg.toolCall.functionCalls) {
        var responses = msg.toolCall.functionCalls.map(function(fc) {
          var resObj = { result: '완료되었습니다.' };
          if (fc.name === 'create_academy_task') {
            var a = fc.args || {};
            pendingTasks.unshift({
              id: 'task_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              student: a.student || '학생',
              category: a.category || '업무처리',
              summary: a.summary || '',
              isReport: !!a.isReport || a.category === '학부모 리포트'
            });
            renderPendingTasks();
            resObj = { result: a.student + ' 학생 ' + a.category + ' 건을 승인 대기 목록에 등록했습니다.' };
          } else if (fc.name === 'approve_all_tasks') {
            approveAllTasks();
            resObj = { result: '대기 중인 모든 작업을 승인 완료했습니다.' };
          }
          return { id: fc.id, name: fc.name, response: resObj };
        });

        ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
        return;
      }

      if (msg.serverContent) {
        var sc = msg.serverContent;

        if (sc.interrupted) {
          stopAllPlayback();
          currentAiBubble = null;
        }

        if (sc.inputTranscription && sc.inputTranscription.text) {
          appendOrUpdateStreamBubble('user', sc.inputTranscription.text);
          currentAiBubble = null;
        }

        if (sc.outputTranscription && sc.outputTranscription.text) {
          appendOrUpdateStreamBubble('assistant', sc.outputTranscription.text);
          currentUserBubble = null;
        }

        if (sc.modelTurn && sc.modelTurn.parts) {
          sc.modelTurn.parts.forEach(function(part) {
            if (part.inlineData && part.inlineData.data) {
              playPcm24kAudio(part.inlineData.data);
            }
          });
        }

        if (sc.turnComplete) {
          currentUserBubble = null;
          currentAiBubble = null;
        }
      }
    }

    // =========================================================
    // 오디오 인코딩/디코딩 & 초저지연 재생 엔진
    // =========================================================
    function downsampleTo16k(buffer, sampleRate) {
      if (sampleRate === 16000) {
        var outSame = new Int16Array(buffer.length);
        for (var i = 0; i < buffer.length; i++) {
          var s = Math.max(-1, Math.min(1, buffer[i]));
          outSame[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return outSame;
      }
      var ratio = sampleRate / 16000;
      var newLen = Math.round(buffer.length / ratio);
      var result = new Int16Array(newLen);
      var offsetResult = 0;
      var offsetBuffer = 0;
      while (offsetResult < result.length) {
        var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        var accum = 0, count = 0;
        for (var j = offsetBuffer; j < nextOffsetBuffer && j < buffer.length; j++) {
          accum += buffer[j];
          count++;
        }
        var sample = Math.max(-1, Math.min(1, accum / (count || 1)));
        result[offsetResult] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function playPcm24kAudio(base64Data) {
      if (!playbackCtx) return;
      var binary = atob(base64Data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      var int16 = new Int16Array(bytes.buffer);
      var float32 = new Float32Array(int16.length);
      for (var j = 0; j < int16.length; j++) float32[j] = int16[j] / 32768.0;

      var audioBuffer = playbackCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      var source = playbackCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(playbackCtx.destination);

      var now = playbackCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now + 0.02;
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;

      activeSources.push(source);
      source.onended = function() {
        var idx = activeSources.indexOf(source);
        if (idx !== -1) activeSources.splice(idx, 1);
      };
    }

    function stopAllPlayback() {
      activeSources.forEach(function(src) {
        try { src.stop(); } catch (e) {}
      });
      activeSources = [];
      nextPlayTime = 0;
    }

    function arrayBufferToBase64(buffer) {
      var bytes = new Uint8Array(buffer);
      var binary = '';
      var chunkSize = 0x8000;
      for (var i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function stopLiveSession() {
      if (ws) { try { ws.close(); } catch (e) {} }
      cleanupLiveSession();
    }

    function cleanupLiveSession() {
      isLiveConnected = false;
      ws = null;
      stopAllPlayback();

      if (processorNode) { try { processorNode.disconnect(); } catch (e) {} processorNode = null; }
      if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(function(t) { t.stop(); }); mediaStream = null; }
      if (captureCtx) { try { captureCtx.close(); } catch (e) {} captureCtx = null; }
      if (playbackCtx) { try { playbackCtx.close(); } catch (e) {} playbackCtx = null; }

      currentUserBubble = null;
      currentAiBubble = null;
      setLiveUI('OFF', '[실시간 음성 대화 시작] 버튼을 눌러 런비스와 통화를 시작하세요.');
    }

    function toggleMute() {
      isMuted = !isMuted;
      var t = document.getElementById('muteBtnTitle');
      var s = document.getElementById('muteBtnSub');
      if (isMuted) {
        t.textContent = '마이크 켜기';
        s.textContent = '현재 음소거됨';
        showToast('마이크가 음소거되었습니다.');
      } else {
        t.textContent = '마이크 끄기';
        s.textContent = '일시 음소거';
        showToast('마이크가 다시 켜졌습니다.');
      }
    }

    function handleTextSubmit(e) {
      if (e) e.preventDefault();
      var input = document.getElementById('textInput');
      var text = input.value.trim();
      if (!text) return;
      input.value = '';

      if (!isLiveConnected || !ws || ws.readyState !== WebSocket.OPEN) {
        showToast('먼저 [실시간 음성 대화 시작] 버튼을 눌러 연결해 주세요!');
        return;
      }

      appendChat('user', text);
      ws.send(JSON.stringify({
        clientContent: {
          turns: [{ role: 'user', parts: [{ text: text }] }],
          turnComplete: true
        }
      }));
    }

    // =========================================================
    // UI 및 업무 카드 관리
    // =========================================================
    function appendOrUpdateStreamBubble(role, chunkText) {
      var stream = document.getElementById('chatStream');
      if (role === 'user') {
        if (!currentUserBubble) {
          var wrap = document.createElement('div');
          wrap.className = 'flex flex-col items-end space-y-1';
          wrap.innerHTML = '<span class="text-[11px] font-bold text-[#999999]">원장님</span>' +
            '<div class="bg-[#2c2c2c] border border-[#444444] rounded-lg rounded-tr-none px-3.5 py-2 text-xs sm:text-sm text-white max-w-[90%] leading-relaxed"></div>';
          stream.appendChild(wrap);
          currentUserBubble = wrap.querySelector('div');
        }
        currentUserBubble.textContent += chunkText;
      } else {
        if (!currentAiBubble) {
          var wrapAi = document.createElement('div');
          wrapAi.className = 'flex flex-col items-start space-y-1';
          wrapAi.innerHTML = '<span class="text-[11px] font-bold text-[#E50914]">RUN-VIS LIVE</span>' +
            '<div class="bg-[#181818] border border-[#333333] rounded-lg rounded-tl-none px-3.5 py-2 text-xs sm:text-sm text-[#EAEAEA] max-w-[92%] leading-relaxed"></div>';
          stream.appendChild(wrapAi);
          currentAiBubble = wrapAi.querySelector('div');
        }
        currentAiBubble.textContent += chunkText;
      }
      stream.scrollTop = stream.scrollHeight;
    }

    function appendChat(role, text) {
      var stream = document.getElementById('chatStream');
      var wrap = document.createElement('div');
      if (role === 'user') {
        wrap.className = 'flex flex-col items-end space-y-1';
        wrap.innerHTML = '<span class="text-[11px] font-bold text-[#999999]">원장님</span>' +
          '<div class="bg-[#2c2c2c] border border-[#444444] rounded-lg rounded-tr-none px-3.5 py-2 text-xs sm:text-sm text-white max-w-[90%] leading-relaxed">' + escapeHtml(text) + '</div>';
      } else if (role === 'system') {
        wrap.className = 'flex justify-center';
        wrap.innerHTML = '<div class="bg-[#2a1416] border border-[#E50914]/50 rounded px-3 py-1.5 text-[11px] text-[#ff8a90] break-all">' + escapeHtml(text) + '</div>';
      } else {
        wrap.className = 'flex flex-col items-start space-y-1';
        wrap.innerHTML = '<span class="text-[11px] font-bold text-[#E50914]">RUN-VIS LIVE</span>' +
          '<div class="bg-[#181818] border border-[#333333] rounded-lg rounded-tl-none px-3.5 py-2 text-xs sm:text-sm text-[#EAEAEA] max-w-[92%] leading-relaxed">' + escapeHtml(text) + '</div>';
      }
      stream.appendChild(wrap);
      stream.scrollTop = stream.scrollHeight;
    }

    function renderPendingTasks() {
      var area = document.getElementById('pendingArea');
      var badge = document.getElementById('pendingCountBadge');
      var approveBtn = document.getElementById('approveAllBtn');

      badge.textContent = pendingTasks.length + '건';
      if (pendingTasks.length === 0) {
        approveBtn.classList.add('hidden');
        area.innerHTML = '<div class="py-7 text-center text-xs text-[#777777]">대화 중 출결·보강·과제·학부모 리포트를 지시하시면 여기에 카드로 정리됩니다.</div>';
        return;
      }

      approveBtn.classList.remove('hidden');
      area.innerHTML = pendingTasks.map(function(t) {
        var bodyHtml = t.isReport
          ? '<textarea data-task-edit="' + t.id + '" rows="4" class="w-full bg-[#111111] border border-[#333333] rounded p-2.5 text-xs text-[#EAEAEA] leading-relaxed outline-none">' + escapeHtml(t.summary) + '</textarea>'
          : '<div class="text-xs text-[#CCCCCC]">' + escapeHtml(t.summary) + '</div>';
        return '<div class="bg-[#181818] border border-[#383838] rounded-lg p-3.5 space-y-2">' +
          '<div class="flex items-center justify-between">' +
            '<div class="flex items-center gap-2">' +
              '<span class="px-2 py-0.5 rounded bg-[#E50914]/20 border border-[#E50914]/50 text-[#ff6b72] text-[11px] font-bold">' + escapeHtml(t.category) + '</span>' +
              '<span class="text-sm font-bold text-white">' + escapeHtml(t.student) + '</span>' +
            '</div>' +
            '<button type="button" data-approve-id="' + t.id + '" class="px-3 py-1 rounded bg-[#E50914] hover:bg-[#c80812] text-xs font-bold text-white cursor-pointer">승인</button>' +
          '</div>' +
          bodyHtml +
        '</div>';
      }).join('');
    }

    function approveSingleTask(id) {
      var idx = pendingTasks.findIndex(function(t) { return t.id === id; });
      if (idx === -1) return;
      var item = pendingTasks.splice(idx, 1)[0];
      addLog('[' + item.category + '] ' + item.student + ' - ' + item.summary.slice(0, 40) + (item.summary.length > 40 ? '...' : ''));
      renderPendingTasks();
      showToast('승인 및 처리 완료되었습니다.');
    }

    function approveAllTasks() {
      if (pendingTasks.length === 0) return;
      pendingTasks.forEach(function(item) {
        addLog('[' + item.category + '] ' + item.student + ' - ' + item.summary.slice(0, 40) + (item.summary.length > 40 ? '...' : ''));
      });
      pendingTasks = [];
      renderPendingTasks();
      showToast('전체 승인 및 발송이 완료되었습니다!');
    }

    function addLog(text) {
      var now = new Date();
      var time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      actionLogs.unshift({ time: time, text: text });
      document.getElementById('logArea').innerHTML = actionLogs.map(function(l) {
        return '<div class="bg-[#181818] border border-[#2f2f2f] rounded px-3 py-2 flex items-center justify-between gap-2 text-xs">' +
          '<span class="text-[#DDDDDD] truncate">' + escapeHtml(l.text) + '</span>' +
          '<span class="text-[#777777] shrink-0">' + l.time + ' 완료</span>' +
        '</div>';
      }).join('');
    }

    function openSettingsModal() {
      document.getElementById('modalApiKeyInput').value = getApiKey();
      document.getElementById('modalVoiceSelect').value = getVoiceName();
      document.getElementById('modalModelInput').value = getLiveModel();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      var k = document.getElementById('modalApiKeyInput').value.replace(/\s+/g, '').trim();
      var v = document.getElementById('modalVoiceSelect').value;
      var m = document.getElementById('modalModelInput').value.trim();
      try {
        if (k) localStorage.setItem('runvis_api_key', k);
        if (v) localStorage.setItem('runvis_live_voice', v);
        if (m) localStorage.setItem('runvis_live_model', m);
      } catch (e) {}
      closeSettingsModal();
      showToast('설정이 저장되었습니다. (통화 재시작 시 적용)');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', function() {
      try { isSearchEnabled = localStorage.getItem('runvis_search_on') === '1'; } catch (e) {}
      updateSearchBtnUI();

      document.getElementById('liveToggleBtn').addEventListener('click', toggleLiveSession);
      document.getElementById('btnMuteMic').addEventListener('click', toggleMute);
      document.getElementById('btnToggleSearch').addEventListener('click', toggleSearchMode);
      document.getElementById('btnOpenSettings').addEventListener('click', openSettingsModal);
      document.getElementById('btnCloseSettingsX').addEventListener('click', closeSettingsModal);
      document.getElementById('btnCloseSettings').addEventListener('click', closeSettingsModal);
      document.getElementById('btnSaveSettings').addEventListener('click', saveSettings);
      document.getElementById('btnClearChat').addEventListener('click', function() {
        document.getElementById('chatStream').innerHTML = '';
        currentUserBubble = null;
        currentAiBubble = null;
      });
      document.getElementById('btnClearLogs').addEventListener('click', function() {
        actionLogs = [];
        document.getElementById('logArea').innerHTML = '<div class="py-3 text-center text-xs text-[#666666]">완료된 내역이 없습니다.</div>';
      });
      document.getElementById('approveAllBtn').addEventListener('click', approveAllTasks);
      document.getElementById('chatForm').addEventListener('submit', handleTextSubmit);

      document.getElementById('pendingArea').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-approve-id]');
        if (btn) approveSingleTask(btn.getAttribute('data-approve-id'));
      });
      document.getElementById('pendingArea').addEventListener('change', function(e) {
        var ta = e.target.closest('[data-task-edit]');
        if (ta) {
          var target = pendingTasks.find(function(t) { return t.id === ta.getAttribute('data-task-edit'); });
          if (target) target.summary = ta.value;
        }
      });
    });
  </script>
