<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RUN-VIS LITE | 초경량 순수 티키타카 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #141414;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    .live-active {
      background-color: #E50914 !important;
      border-color: #E50914 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 24px rgba(229, 9, 20, 0.55);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-black border-b border-[#333333] px-4 py-3.5 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <span class="text-lg sm:text-xl font-black tracking-wide text-[#E50914]">RUN-VIS</span>
        <span class="px-1.5 py-0.5 rounded bg-[#E50914]/20 border border-[#E50914]/50 text-[10px] font-black text-[#ff6b72]">LITE</span>
        <span class="text-xs text-[#B3B3B3] hidden sm:inline">순수 티키타카 속도 테스트</span>
      </div>

      <div class="flex items-center gap-2">
        <div id="statePill" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#181818] border border-[#333333] text-xs font-bold text-[#999999]">
          <span id="stateDot" class="w-2 h-2 rounded-full bg-[#666666]"></span>
          <span id="stateLabel">대기중</span>
        </div>
        <button
          type="button"
          id="btnOpenSettings"
          class="px-3 py-1.5 rounded bg-[#222222] border border-[#333333] text-xs font-bold text-[#B3B3B3] hover:text-white cursor-pointer"
        >설정</button>
      </div>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-3 sm:px-5 py-4 space-y-4">

    <section class="bg-[#222222] border border-[#333333] rounded-lg p-4 sm:p-5 space-y-3.5">
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-bold text-[#B3B3B3]">도구·게이트 제거 · 순수 음성 왕복</span>
        <span id="aiModeBadge" class="px-2.5 py-1 rounded-full bg-[#141414] border border-[#333333] text-xs font-bold text-[#999999]">
          ⏸ 대기중
        </span>
      </div>

      <button
        type="button"
        id="liveToggleBtn"
        class="w-full py-4 px-4 rounded-lg border border-[#444444] bg-[#181818] hover:bg-[#2a2a2a] active:scale-[0.99] transition flex items-center justify-between gap-3 cursor-pointer"
      >
        <div class="flex items-center gap-3.5">
          <span id="micIconWrap" class="w-11 h-11 rounded-full bg-[#2a2a2a] flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" />
            </svg>
          </span>
          <div class="text-left">
            <div id="liveBtnTitle" class="text-base font-bold text-white">실시간 음성 대화 시작</div>
            <div id="liveBtnSub" class="text-xs text-[#B3B3B3]">초경량 테스트 모드 · 말 끊기 즉시 반응</div>
          </div>
        </div>
        <span id="liveSwitchBadge" class="px-3 py-1 rounded bg-[#2a2a2a] text-xs font-bold text-[#999999] shrink-0">OFF</span>
      </button>

      <div class="bg-[#141414] border border-[#333333] rounded-md px-3.5 py-2.5 text-xs flex items-center gap-2">
        <span class="text-[#E50914] font-bold shrink-0">상태:</span>
        <span id="liveStatusText" class="text-[#DDDDDD] truncate">[실시간 음성 대화 시작] 버튼을 눌러 테스트하세요.</span>
      </div>
    </section>

    <section class="bg-[#222222] border border-[#333333] rounded-lg flex flex-col h-[420px]">
      <div class="px-4 py-3 border-b border-[#333333] flex items-center justify-between">
        <span class="text-xs font-bold text-white">대화 로그</span>
        <button type="button" id="btnClearChat" class="text-[11px] text-[#B3B3B3] hover:text-white cursor-pointer">비우기</button>
      </div>
      <div id="chatStream" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex flex-col items-start space-y-1">
          <span class="text-[11px] font-bold text-[#E50914]">RUN-VIS LITE</span>
          <div class="bg-[#181818] border border-[#333333] rounded-lg rounded-tl-none px-3.5 py-2.5 text-xs sm:text-sm text-[#EAEAEA] max-w-[92%] leading-relaxed">
            초경량 테스트 모드입니다. 통화를 켜고 <strong>"런비스"</strong>라고 부르거나 짧게 말씀해 보시면서 순수 반응 속도를 확인해 보세요!
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 설정 모달 -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-[#222222] border border-[#333333] rounded-lg max-w-md w-full p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-[#333333] pb-3">
        <h3 class="text-base font-bold text-white">런비스 LITE 설정</h3>
        <button type="button" id="btnCloseSettingsX" class="text-[#B3B3B3] hover:text-white text-sm font-bold px-2 py-1 cursor-pointer">✕</button>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">Gemini API Key</label>
        <input
          id="modalApiKeyInput"
          type="text"
          placeholder="AIzaSy..."
          class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none"
        />
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">AI 목소리 선택</label>
        <select id="modalVoiceSelect" class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none">
          <option value="Leda">Leda (젊고 생기 있는 여성 · 기본)</option>
          <option value="Zephyr">Zephyr (밝고 상쾌한 여성)</option>
          <option value="Aoede">Aoede (친근하고 부드러운 여성)</option>
          <option value="Kore">Kore (차분하고 또렷한 여성)</option>
          <option value="Puck">Puck (활기찬 남성)</option>
          <option value="Charon">Charon (중후한 남성)</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#B3B3B3]">Live 모델명</label>
        <input
          id="modalModelInput"
          type="text"
          class="w-full bg-[#141414] border border-[#333333] rounded-md px-3 py-2 text-xs text-white outline-none"
        />
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" id="btnCloseSettings" class="flex-1 py-2.5 rounded-md border border-[#333333] bg-[#2a2a2a] text-xs font-bold text-white cursor-pointer">닫기</button>
        <button type="button" id="btnSaveSettings" class="flex-1 py-2.5 rounded-md bg-[#E50914] text-xs font-bold text-white cursor-pointer">저장</button>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-md bg-[#2a2a2a] border border-[#444444] text-xs font-bold text-white shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    var DEFAULT_LIVE_MODEL = 'gemini-2.5-flash-native-audio-preview-09-2025';
    var DEFAULT_VOICE = 'Leda';

    var ws = null;
    var isConnected = false;
    var audioCtx = null;
    var mediaStream = null;
    var micSource = null;
    var processorNode = null;
    var nextPlayTime = 0;
    var activeSources = [];

    var currentUserBubble = null;
    var currentAiBubble = null;

    function getApiKey() {
      try { return (localStorage.getItem('runvis_api_key') || '').replace(/\s+/g, '').trim(); } catch (e) { return ''; }
    }
    function getVoiceName() {
      try { return localStorage.getItem('runvis_live_voice') || DEFAULT_VOICE; } catch (e) { return DEFAULT_VOICE; }
    }
    function getLiveModel() {
      try { return (localStorage.getItem('runvis_live_model') || DEFAULT_LIVE_MODEL).trim(); } catch (e) { return DEFAULT_LIVE_MODEL; }
    }

    function showToast(msg) {
      var box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('opacity-0');
      clearTimeout(box._t);
      box._t = setTimeout(function() { box.classList.add('opacity-0'); }, 2400);
    }

    function setPhaseUI(phase, statusMsg) {
      var dot = document.getElementById('stateDot');
      var label = document.getElementById('stateLabel');
      var pill = document.getElementById('statePill');
      var badge = document.getElementById('aiModeBadge');
      var btn = document.getElementById('liveToggleBtn');
      var title = document.getElementById('liveBtnTitle');
      var sub = document.getElementById('liveBtnSub');
      var swBadge = document.getElementById('liveSwitchBadge');
      var iconWrap = document.getElementById('micIconWrap');

      if (statusMsg) document.getElementById('liveStatusText').textContent = statusMsg;
      btn.classList.remove('live-active');

      if (phase === 'OFF') {
        dot.className = 'w-2 h-2 rounded-full bg-[#666666]';
        label.textContent = '대기중';
        label.className = 'text-[#999999] font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#181818] border border-[#333333] text-xs font-bold';
        badge.textContent = '⏸ 대기중';
        badge.className = 'px-2.5 py-1 rounded-full bg-[#141414] border border-[#333333] text-xs font-bold text-[#999999]';
        iconWrap.className = 'w-11 h-11 rounded-full bg-[#2a2a2a] text-white flex items-center justify-center shrink-0';
        title.textContent = '실시간 음성 대화 시작';
        sub.textContent = '초경량 테스트 모드 · 말 끊기 즉시 반응';
        swBadge.textContent = 'OFF';
        swBadge.className = 'px-3 py-1 rounded bg-[#2a2a2a] text-[#999999] text-xs font-bold shrink-0';
        return;
      }

      btn.classList.add('live-active');
      iconWrap.className = 'w-11 h-11 rounded-full bg-white text-[#E50914] flex items-center justify-center shrink-0';
      title.textContent = '통화 종료하기';
      sub.textContent = '말하는 도중 끼어들면 즉시 멈춥니다.';
      swBadge.textContent = 'LIVE';
      swBadge.className = 'px-3 py-1 rounded bg-white text-[#E50914] text-xs font-black shrink-0';

      if (phase === 'CONNECTING') {
        dot.className = 'w-2 h-2 rounded-full bg-yellow-400 animate-pulse';
        label.textContent = '연결중';
        label.className = 'text-yellow-300 font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#262212] border border-yellow-500/50 text-xs font-bold';
        badge.textContent = '🔄 연결중...';
        badge.className = 'px-2.5 py-1 rounded-full bg-[#262212] border border-yellow-500/50 text-xs font-bold text-yellow-300';
      } else if (phase === 'LISTENING') {
        dot.className = 'w-2 h-2 rounded-full bg-[#E50914] animate-ping';
        label.textContent = '듣는중';
        label.className = 'text-white font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#2a1214] border border-[#E50914] text-xs font-bold';
        badge.textContent = '🎤 듣는중';
        badge.className = 'px-2.5 py-1 rounded-full bg-[#2a1214] border border-[#E50914] text-xs font-bold text-[#ff6b72]';
      } else if (phase === 'SPEAKING') {
        dot.className = 'w-2 h-2 rounded-full bg-[#4ade80] animate-pulse';
        label.textContent = '말하는중';
        label.className = 'text-[#4ade80] font-bold';
        pill.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#13261a] border border-[#4ade80]/60 text-xs font-bold';
        badge.textContent = '🔊 말하는중';
        badge.className = 'px-2.5 py-1 rounded-full bg-[#13261a] border border-[#4ade80]/60 text-xs font-bold text-[#4ade80]';
      }
    }

    function toggleLive() {
      if (isConnected || ws) stopLive();
      else startLive();
    }

    async function startLive() {
      var apiKey = getApiKey();
      if (!apiKey) {
        showToast('우측 상단 [설정]에서 Gemini API 키를 먼저 넣어주세요.');
        openSettingsModal();
        return;
      }

      setPhaseUI('CONNECTING', '서버와 마이크 연결 중...');

      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        nextPlayTime = 0;

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1
          }
        });

        var wsUrl = ['wss:', '', 'generativelanguage.googleapis.com', 'ws', 'google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(apiKey)].join('/');
        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
          var model = getLiveModel();
          if (model.indexOf('models/') !== 0) model = 'models/' + model;

          ws.send(JSON.stringify({
            setup: {
              model: model,
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: getVoiceName()
                    }
                  }
                }
              },
              realtimeInputConfig: {
                automaticActivityDetection: {
                  disabled: false,
                  startOfSpeechSensitivity: 'START_SENSITIVITY_HIGH',
                  endOfSpeechSensitivity: 'END_SENSITIVITY_HIGH',
                  prefixPaddingMs: 40,
                  silenceDurationMs: 120
                }
              },
              inputAudioTranscription: {},
              outputAudioTranscription: {},
              systemInstruction: {
                parts: [{
                  text: '당신은 런수학학원 원장님의 AI 비서 런비스입니다. ' +
                        '원장님이 "런비스" 또는 "런비스야" 하고 부르면 무조건 즉시 "네, 원장님! 말씀해 주세요."라고 짧게 대답하세요. ' +
                        '모든 답변은 군더더기 없이 1~2문장으로 짧고 빠르게 티키타카 하듯 말하세요.'
                }]
              }
            }
          }));
        };

        ws.onmessage = async function(event) {
          try {
            var raw = (event.data instanceof Blob) ? await event.data.text() : event.data;
            var msg = JSON.parse(raw);

            if (msg.setupComplete) {
              isConnected = true;
              setPhaseUI('LISTENING', '🎤 연결됨! "런비스" 하고 불러보세요.');
              startMic();
              return;
            }

            if (msg.serverContent) {
              var sc = msg.serverContent;
              if (sc.interrupted) {
                stopPlayback();
                currentAiBubble = null;
                if (isConnected) setPhaseUI('LISTENING', '🎤 듣는중...');
              }
              if (sc.inputTranscription && sc.inputTranscription.text) {
                appendBubble('user', sc.inputTranscription.text);
                currentAiBubble = null;
              }
              if (sc.outputTranscription && sc.outputTranscription.text) {
                appendBubble('assistant', sc.outputTranscription.text);
                currentUserBubble = null;
              }
              if (sc.modelTurn && sc.modelTurn.parts) {
                sc.modelTurn.parts.forEach(function(part) {
                  if (part.inlineData && part.inlineData.data) {
                    setPhaseUI('SPEAKING', '🔊 말하는중...');
                    playPcm24k(part.inlineData.data);
                  }
                });
              }
              if (sc.turnComplete) {
                currentUserBubble = null;
                currentAiBubble = null;
                if (activeSources.length === 0 && isConnected) {
                  setPhaseUI('LISTENING', '🎤 듣는중...');
                }
              }
            }
          } catch (e) {
            console.error(e);
          }
        };

        ws.onerror = function() {
          appendSystem('WebSocket 오류가 발생했습니다.');
        };

        ws.onclose = function(e) {
          var reason = (e && e.reason) ? (' (' + e.reason + ')') : '';
          cleanupLive('통화가 종료되었습니다.' + reason);
        };
      } catch (err) {
        cleanupLive('시작 오류: ' + err.message);
      }
    }

    function startMic() {
      if (!audioCtx || !mediaStream) return;
      micSource = audioCtx.createMediaStreamSource(mediaStream);
      processorNode = audioCtx.createScriptProcessor(2048, 1, 1);

      processorNode.onaudioprocess = function(e) {
        if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN || !audioCtx) return;
        if (ws.bufferedAmount > 32768) return;

        var inputData = e.inputBuffer.getChannelData(0);

        // 말하는 도중 끼어들기 (목소리 입력 시 즉시 재생 중단)
        if (activeSources.length > 0) {
          var sumSq = 0;
          for (var i = 0; i < inputData.length; i++) sumSq += inputData[i] * inputData[i];
          var rms = Math.sqrt(sumSq / inputData.length);
          if (rms > 0.045) {
            stopPlayback();
            currentAiBubble = null;
            setPhaseUI('LISTENING', '🎤 듣는중...');
          }
        }

        var pcm16 = downsampleTo16k(inputData, audioCtx.sampleRate);
        var b64 = arrayBufferToBase64(pcm16.buffer);

        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: 'audio/pcm;rate=16000',
              data: b64
            }]
          }
        }));
      };

      micSource.connect(processorNode);
      processorNode.connect(audioCtx.destination);
    }

    function downsampleTo16k(buffer, sampleRate) {
      if (sampleRate === 16000) {
        var out = new Int16Array(buffer.length);
        for (var i = 0; i < buffer.length; i++) {
          var s = Math.max(-1, Math.min(1, buffer[i]));
          out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return out;
      }
      var ratio = sampleRate / 16000;
      var newLen = Math.round(buffer.length / ratio);
      var result = new Int16Array(newLen);
      var offsetResult = 0;
      var offsetBuffer = 0;
      while (offsetResult < result.length) {
        var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        var accum = 0, count = 0;
        for (var j = offsetBuffer; j < nextOffsetBuffer && j < buffer.length; j++) {
          accum += buffer[j];
          count++;
        }
        var sample = Math.max(-1, Math.min(1, accum / (count || 1)));
        result[offsetResult] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function playPcm24k(base64Data) {
      if (!audioCtx) return;
      var binary = atob(base64Data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      var int16 = new Int16Array(bytes.buffer);
      var float32 = new Float32Array(int16.length);
      for (var j = 0; j < int16.length; j++) float32[j] = int16[j] / 32768.0;

      var audioBuffer = audioCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      var source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      var now = audioCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now + 0.01;
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;

      activeSources.push(source);
      source.onended = function() {
        var idx = activeSources.indexOf(source);
        if (idx !== -1) activeSources.splice(idx, 1);
        if (activeSources.length === 0 && isConnected) {
          setPhaseUI('LISTENING', '🎤 듣는중...');
        }
      };
    }

    function stopPlayback() {
      activeSources.forEach(function(src) {
        try { src.stop(); } catch (e) {}
      });
      activeSources = [];
      nextPlayTime = 0;
    }

    function arrayBufferToBase64(buffer) {
      var bytes = new Uint8Array(buffer);
      var binary = '';
      var chunkSize = 0x8000;
      for (var i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function stopLive() {
      if (ws) { try { ws.close(); } catch (e) {} }
      cleanupLive('통화가 종료되었습니다.');
    }

    function cleanupLive(msg) {
      isConnected = false;
      ws = null;
      stopPlayback();
      if (processorNode) { try { processorNode.disconnect(); } catch (e) {} processorNode = null; }
      if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(function(t) { t.stop(); }); mediaStream = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
      currentUserBubble = null;
      currentAiBubble = null;
      setPhaseUI('OFF', msg || '[실시간 음성 대화 시작] 버튼을 눌러 테스트하세요.');
    }

    function appendBubble(role, text) {
      var stream = document.getElementById('chatStream');
      if (role === 'user') {
        if (!currentUserBubble) {
          var w = document.createElement('div');
          w.className = 'flex flex-col items-end space-y-1';
          w.innerHTML = '<span class="text-[11px] font-bold text-[#999999]">원장님</span>' +
            '<div class="bg-[#2c2c2c] border border-[#444444] rounded-lg rounded-tr-none px-3.5 py-2 text-xs sm:text-sm text-white max-w-[90%]"></div>';
          stream.appendChild(w);
          currentUserBubble = w.querySelector('div');
        }
        currentUserBubble.textContent += text;
      } else {
        if (!currentAiBubble) {
          var wAi = document.createElement('div');
          wAi.className = 'flex flex-col items-start space-y-1';
          wAi.innerHTML = '<span class="text-[11px] font-bold text-[#E50914]">RUN-VIS LITE</span>' +
            '<div class="bg-[#181818] border border-[#333333] rounded-lg rounded-tl-none px-3.5 py-2 text-xs sm:text-sm text-[#EAEAEA] max-w-[92%]"></div>';
          stream.appendChild(wAi);
          currentAiBubble = wAi.querySelector('div');
        }
        currentAiBubble.textContent += text;
      }
      stream.scrollTop = stream.scrollHeight;
    }

    function appendSystem(text) {
      var stream = document.getElementById('chatStream');
      var w = document.createElement('div');
      w.className = 'flex justify-center';
      w.innerHTML = '<div class="bg-[#2a1416] border border-[#E50914]/50 rounded px-3 py-1.5 text-[11px] text-[#ff8a90]">' + escapeHtml(text) + '</div>';
      stream.appendChild(w);
      stream.scrollTop = stream.scrollHeight;
    }

    function openSettingsModal() {
      document.getElementById('modalApiKeyInput').value = getApiKey();
      document.getElementById('modalVoiceSelect').value = getVoiceName();
      document.getElementById('modalModelInput').value = getLiveModel();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      var k = document.getElementById('modalApiKeyInput').value.replace(/\s+/g, '').trim();
      var v = document.getElementById('modalVoiceSelect').value;
      var m = document.getElementById('modalModelInput').value.trim();
      try {
        if (k) localStorage.setItem('runvis_api_key', k);
        if (v) localStorage.setItem('runvis_live_voice', v);
        if (m) localStorage.setItem('runvis_live_model', m);
      } catch (e) {}
      closeSettingsModal();
      showToast('설정이 저장되었습니다.');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('liveToggleBtn').addEventListener('click', toggleLive);
      document.getElementById('btnOpenSettings').addEventListener('click', openSettingsModal);
      document.getElementById('btnCloseSettingsX').addEventListener('click', closeSettingsModal);
      document.getElementById('btnCloseSettings').addEventListener('click', closeSettingsModal);
      document.getElementById('btnSaveSettings').addEventListener('click', saveSettings);
      document.getElementById('btnClearChat').addEventListener('click', function() {
        document.getElementById('chatStream').innerHTML = '';
        currentUserBubble = null;
        currentAiBubble = null;
      });
    });
  </script>
</body>
</html>
